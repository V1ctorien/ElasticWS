input {
  http { }
}

filter {
  # --- Déduction du département à partir du code postal -------------------
  # Interroger bano-25 est bien plus rapide qu'interroger l'alias bano, qui
  # couvre tous les index. Si le code postal est connu, on en tire le numéro
  # de département pour cibler le bon index.
  if [address][zipcode] {
    mutate { add_field => { "dept" => "%{[address][zipcode]}" } }
    truncate {
      fields => ["dept"]
      length_bytes => 2
    }
    # L'outre-mer porte des numéros à trois chiffres, tous commençant par 97
    if [dept] == "97" {
      mutate { replace => { "dept" => "%{[address][zipcode]}" } }
      truncate {
        fields => ["dept"]
        length_bytes => 3
      }
    }
    mutate { add_field => { "index_suffix" => "-%{dept}" } }
  } else {
    # Sans code postal, le suffixe est vide : on interroge l'alias entier
    mutate { add_field => { "dept" => "" } }
    mutate { add_field => { "index_suffix" => "" } }
  }

  # --- Recherche dans BANO -------------------------------------------------
  if [location][lat] and [location][lon] {
    # Coordonnées connues : recherche par distance
    elasticsearch {
      hosts => ["http://${ES_HOST}:9200"]
      user => "elastic"
      password => "${ES_PASSWORD}"
      query_template => "/pipeline/search-by-geo.json"
      index => "bano%{index_suffix}"
      fields => {
        "location" => "[location]"
        "address"  => "[address]"
      }
      remove_field => ["headers", "host", "@version", "@timestamp", "index_suffix", "dept"]
    }
  } else {
    # Sinon : recherche plein texte sur l'adresse
    elasticsearch {
      hosts => ["http://${ES_HOST}:9200"]
      user => "elastic"
      password => "${ES_PASSWORD}"
      query_template => "/pipeline/search-by-name.json"
      index => "bano%{index_suffix}"
      fields => {
        "location" => "[location]"
        "address"  => "[address]"
      }
      remove_field => ["headers", "host", "@version", "@timestamp", "index_suffix", "dept"]
    }
  }
}

output {
  stdout { codec => rubydebug }
}
